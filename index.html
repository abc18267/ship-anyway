<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F7A66">
<meta name="description" content="Start small, save your place, and finish at good enough. A gentle task companion with two-minute starts and optional focus sessions.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Ship Anyway</title>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* One column, one next action, optional detail. */
:root{
  --bg:#F1F4F6; --surface:#FFFFFF; --soft:#E6ECF1; --line:#D5DCE3;
  --ink:#16212C; --muted:#5B6A79;
  --go:#0F7A66; --go-ink:#FFFFFF; --go-soft:#DCEFE9;
  --warn:#A8701A; --warn-bg:#FBF1DD;
  --bad:#B0393B; --bad-bg:#F9E6E6;
  --font-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --font-body:"IBM Plex Sans","Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono","SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1317; --surface:#161D24; --soft:#1F2932; --line:#2A3540;
  --ink:#E4EAF0; --muted:#8E9CAA;
  --go:#38B897; --go-ink:#06231C; --go-soft:#173A32;
  --warn:#E2A94C; --warn-bg:#33281A;
  --bad:#E07070; --bad-bg:#3A2020;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0E1317; --surface:#161D24; --soft:#1F2932; --line:#2A3540;
  --ink:#E4EAF0; --muted:#8E9CAA;
  --go:#38B897; --go-ink:#06231C; --go-soft:#173A32;
  --warn:#E2A94C; --warn-bg:#33281A;
  --bad:#E07070; --bad-bg:#3A2020;
  color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 128px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--font-display);font-weight:800;font-size:22px;letter-spacing:-.01em;margin:0}
.sync{font-size:12px;color:var(--muted)}
nav{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:10px}
nav a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;padding:8px;border-radius:7px}
nav a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
h2{font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:.02em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.card.go{border-color:var(--go);background:var(--go-soft)}
.card.warn{border-color:var(--warn);background:var(--warn-bg)}
.card.bad{border-color:var(--bad);background:var(--bad-bg)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.grow{flex:1 1 160px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
input[type=text],input[type=date],input[type=number],textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;width:100%}
textarea{resize:vertical;min-height:44px}
input:focus-visible,button:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid var(--go);outline-offset:2px}
button{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 14px;cursor:pointer}
button.primary{background:var(--go);color:var(--go-ink);border-color:var(--go);font-size:17px;padding:14px 18px;width:100%}
button.quiet{background:transparent;color:var(--muted)}
button.danger{border-color:var(--bad);color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
a.chip{text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;min-height:44px}
.muted{color:var(--muted)}
.small{font-size:13px}
.title{font-family:var(--font-display);font-weight:800;font-size:20px;line-height:1.2;text-wrap:balance;margin:0}
.clock{font-family:var(--font-mono);font-weight:500;font-size:56px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:6px 0}
.clock.over{color:var(--warn)}
.done-line{border-left:3px solid var(--go);padding:4px 0 4px 12px;margin:4px 0}
.done-line b{display:block;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
ul.plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ul.plain li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--soft);border-radius:10px}
ul.plain li span{min-width:0;overflow-wrap:anywhere}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:420px){.tiles{grid-template-columns:1fr 1fr}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.tile .n{font-family:var(--font-display);font-weight:800;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.tile .l{font-size:12px;color:var(--muted);margin-top:4px}
.tile .b{font-size:12px;color:var(--muted);margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--soft)}
.bar i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}
svg.chart{width:100%;height:auto;display:block;max-width:100%}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--warn);color:#1B1200;border:none;border-radius:999px;padding:14px 18px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.18);z-index:5}
.fab.talk{right:auto;left:max(16px,env(safe-area-inset-left,0px));background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.fab.talk.live{background:var(--bad);color:#fff;border-color:var(--bad)}
.overlay{position:fixed;inset:0;background:rgba(10,14,18,.6);display:flex;align-items:flex-end;justify-content:center;padding:16px;z-index:20}
.overlay .card{width:100%;max-width:560px;max-height:90%;overflow:auto}
.quote{font-family:var(--font-display);font-weight:600;font-size:19px;line-height:1.3;text-wrap:balance;margin:0 0 10px}
summary{cursor:pointer;font-weight:600;padding:6px 0}
details[open]>summary{margin-bottom:12px}
button,a,input,summary{touch-action:manipulation}
button,summary{min-height:44px}
.title,.done-line,p{overflow-wrap:anywhere}
.next-step{padding:12px;background:var(--surface);border-radius:9px;border:1px solid var(--line)}
.next-step b{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.queue-item{align-items:flex-start!important;flex-direction:column}
.queue-item .row{width:100%}
.welcome{margin:0;font-size:15px;color:var(--muted)}
#storage-warning{margin-bottom:0}
#storage-warning p{margin:0 0 8px}
.overlay .card{overscroll-behavior:contain}
/* A quiet companion: finite reactions, no idle animation or moving controls. */
.companion-action{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;align-items:center}
.companion-action>div{min-width:0}
.companion-action .primary{padding-inline:12px}
.companion-caption{font-size:13px;line-height:1.4;color:var(--muted);margin:7px 0 0}
.companion{width:76px;height:88px;display:block;pointer-events:none;user-select:none}
.companion svg{display:block;width:100%;height:100%;overflow:visible}
.companion .buddy-body{transform-origin:56px 87px}
.companion .buddy-bookmark{transform-origin:57px 80px}
.companion .buddy-stars{transform-origin:56px 47px}
.companion-heading{display:flex;gap:12px;align-items:center}
.companion-heading .companion{flex:none;width:60px;height:66px}
.companion-heading .quote{margin:0}
select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-height:44px;width:100%}
select:focus-visible{outline:2px solid var(--go);outline-offset:2px}
.motion-note{display:none}
.character-picker{border:0;padding:0;margin:0;min-width:0}
.character-picker legend{font-size:13px;color:var(--muted);margin-bottom:8px}
.character-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.character-choice{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 4px 10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;text-align:center;font-size:12px;font-weight:600}
.character-choice input{position:absolute;top:6px;left:6px;margin:0;accent-color:var(--go)}
.character-choice:has(input:checked){border-color:var(--go);background:var(--go-soft);box-shadow:inset 0 0 0 1px var(--go)}
.character-choice:has(input:focus-visible){outline:2px solid var(--go);outline-offset:3px}
.character-choice .companion{width:74px;height:80px}
.sound-volume{width:100%;accent-color:var(--go);margin:8px 0;min-height:24px}
@media(max-width:420px){.character-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:360px){.companion-action{grid-template-columns:60px minmax(0,1fr);gap:8px}.companion{width:60px;height:76px}}
@media(prefers-reduced-motion:no-preference){
  .companion[data-motion="gentle"][data-reaction="start"] .buddy-body{animation:buddy-nod .85s ease-in-out both;animation-delay:var(--reaction-delay,0s)}
  .companion[data-motion="gentle"][data-reaction="saved"] .buddy-bookmark{animation:buddy-bookmark .85s ease-out both;animation-delay:var(--reaction-delay,0s)}
  .companion[data-motion="gentle"][data-reaction="finished"] .buddy-body{animation:buddy-hop .85s ease-in-out both;animation-delay:var(--reaction-delay,0s)}
  .companion[data-motion="gentle"][data-reaction="finished"] .buddy-stars{animation:buddy-spark .85s ease-out both;animation-delay:var(--reaction-delay,0s)}
}
@media(prefers-reduced-motion:reduce){.motion-note{display:block}}
@keyframes buddy-nod{0%,100%{transform:rotate(0)}40%{transform:translateY(2px) rotate(6deg)}70%{transform:rotate(-2deg)}}
@keyframes buddy-bookmark{0%{transform:translateY(-7px)}65%{transform:translateY(1px)}100%{transform:translateY(0)}}
@keyframes buddy-hop{0%,100%{transform:translateY(0) rotate(0)}40%{transform:translateY(-6px) rotate(-4deg)}75%{transform:translateY(1px) rotate(2deg)}}
@keyframes buddy-spark{0%{opacity:.2;transform:scale(.8)}55%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;z-index:30}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}
</style>

<div class="wrap">
  <header>
    <h1>Ship Anyway</h1>
    <span class="sync" id="sync">saved in this browser</span>
  </header>
  <nav id="nav">
    <a href="#now" data-view="now">Now</a>
    <a href="#week" data-view="week">Week</a>
    <a href="#setup" data-view="setup">Setup</a>
  </nav>
  <section id="storage-warning" class="card bad" role="alert" hidden></section>
  <main id="view" class="stack"></main>
</div>
<button class="fab" id="fab" data-action="spiral">I’m stuck</button>
<button class="fab talk" id="talk" data-action="talk">Talk</button>
<div id="overlay" class="overlay" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
<input type="file" id="restore-file" accept=".json,application/json" hidden>

<script>
(function(){
'use strict';
const KEY='shipanyway.v1';
const DAY=86400000;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
function dayKey(t){const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function dayStart(key){const [y,m,d]=key.split('-').map(Number);return new Date(y,m-1,d).getTime();}
const today=()=>dayKey(Date.now());
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function fmtDate(key){const d=new Date(dayStart(key));return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});}
function median(a){if(!a.length)return null;const s=[...a].sort((x,y)=>x-y);const m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2;}
function fmtMin(m){if(m==null)return '–';if(m<60)return Math.round(m)+' min';return (m/60).toFixed(1)+' h';}
function relDay(t){const k=dayKey(t);if(k===today())return 'today';if(k===dayKey(Date.now()-DAY))return 'yesterday';return 'on '+fmtDate(k);}
const CHARACTERS={mint:'Mint buddy',bear:'Honey bear',owl:'Lavender owl',sprout:'Little sprout'};
const SOUNDS={chime:'Soft chime',bell:'Warm bell',drops:'Raindrops',rise:'Gentle rise',silent:'Silent'};
const DONE_PRESETS=['A first draft exists.','It has been sent to one person.','It is good enough to stop.'];

function defaults(){
  const t=Date.now();
  return {v:1,updated:t,tasks:[],events:[],active:null,
    settings:{companion:'gentle',character:'mint',sound:'chime',volume:0.5,cap:25,done:'A version exists that another person could look at.',exercise:20,
      start:today(),review:dayKey(t+90*DAY),triggers:{},risk:{}}};
}
// Keep the v1 storage key so existing tasks and sessions survive this release.
function readState(raw){
  const p=JSON.parse(raw,(key,value)=>{
    if(['__proto__','prototype','constructor'].includes(key))throw Error('Unsupported field in backup.');
    return value;
  });
  const obj=v=>v!==null&&typeof v==='object'&&!Array.isArray(v);
  const time=v=>Number.isFinite(v)&&v>=0&&v<=8640000000000000;
  const date=v=>typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v)&&dayKey(dayStart(v))===v;
  const mins=v=>Number.isFinite(v)&&v>=1&&v<=240;
  if(!obj(p)||p.v!==1||!Array.isArray(p.tasks)||!Array.isArray(p.events)||!obj(p.settings))throw Error('Choose a Ship Anyway JSON backup (version 1).');
  if(p.updated!=null&&!time(p.updated))throw Error('Invalid backup date.');
  const ids=new Set();
  for(const t of p.tasks){
    if(!obj(t)||typeof t.id!=='string'||!t.id||ids.has(t.id)||typeof t.title!=='string'||typeof t.done!=='string'||!mins(t.cap)||!time(t.created))throw Error('The backup has an invalid or duplicate task.');
    ids.add(t.id);
    for(const k of ['started','shipped','savedAt','outcomeAt','checkAfter'])if(t[k]!=null&&!time(t[k]))throw Error('Invalid task date.');
    if(t.planned!=null&&!date(t.planned))throw Error('Invalid planned date.');
    for(const k of ['nextStep','revision'])if(t[k]!=null&&typeof t[k]!=='string')throw Error('Invalid task note.');
    if(t.at!=null&&!(typeof t.at==='string'&&/^\d{2}:\d{2}$/.test(t.at)))throw Error('Invalid reminder time.');
    if(t.outcome!=null&&!['fine','minor','problem'].includes(t.outcome))throw Error('Invalid outcome.');
  }
  for(const e of p.events){
    if(!obj(e)||typeof e.t!=='string'||!time(e.at)||(e.recovered!=null&&!time(e.recovered)))throw Error('Invalid event in backup.');
  }
  const d=defaults();
  const settings={...d.settings,...p.settings};
  if(!mins(settings.cap)||!Number.isFinite(settings.exercise)||settings.exercise<5||settings.exercise>60||typeof settings.done!=='string'||!date(settings.start)||!date(settings.review)||!obj(settings.triggers)||!obj(settings.risk))throw Error('Invalid settings in backup.');
  if(!Object.hasOwn(CHARACTERS,settings.character)||!Object.hasOwn(SOUNDS,settings.sound)||!Number.isFinite(settings.volume)||settings.volume<0||settings.volume>1)throw Error('Invalid character or sound setting.');
  if(!['gentle','still','off'].includes(settings.companion))throw Error('Invalid companion setting.');
  if(p.active!=null){
    const a=p.active,t=p.tasks.find(t=>t.id===a.taskId);
    if(!obj(a)||!t||t.shipped||t.dropped||!['work','exercise'].includes(a.phase)||!time(a.ends)||!time(a.startedAt)||!Number.isInteger(a.passes)||a.passes<0||a.passes>2||(a.pausedAt!=null&&!time(a.pausedAt)))throw Error('Invalid active session.');
  }
  return {...d,...p,settings,active:p.active||null};
}
let S=defaults(),storageError='',protectedRaw=null,protectStorage=false;
try{
  const raw=localStorage.getItem(KEY);
  if(raw){
    try{S=readState(raw);}
    catch(e){protectedRaw=raw;protectStorage=true;storageError='Your saved data could not be read. It has been kept untouched. Download it before restoring a backup or resetting.';}
  }
}catch(e){storageError='Browser storage is unavailable. Keep this tab open and download a backup to keep your work.';}
const welcomeBack=S.tasks.length>0&&Date.now()-S.updated>3*DAY;
let pendingRestore=null;

/* ---------- persistence ---------- */
function storageStatus(){
  $('#sync').textContent=storageError?'not saved — download a backup':'saved in this browser';
  const el=$('#storage-warning');el.hidden=!storageError;
  el.innerHTML=storageError?`<p>${esc(storageError)}</p><button data-action="export">Download current work</button>${protectedRaw!==null?' <button data-action="export-original">Download original saved data</button>':''}`:'';
}
function save(){
  S.updated=Date.now();
  // No automatic pruning: unfinished tasks and history belong to the user.
  let saved=false;
  if(!protectStorage){
    try{localStorage.setItem(KEY,JSON.stringify(S));storageError='';saved=true;}
    catch(e){storageError='Your latest changes could not be saved in this browser. Keep this tab open and download a backup before leaving.';}
  }
  storageStatus();render();return saved;
}
function download(raw,name){
  const url=URL.createObjectURL(new Blob([raw],{type:'application/json'}));
  const link=document.createElement('a');link.href=url;link.download=name;
  document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);
}
function exportData(){download(JSON.stringify(S,null,2),'ship-anyway-'+today()+'.json');}
async function prepareRestore(file){
  if(!file)return;
  try{
    if(file.size>10*1024*1024)throw Error('This backup is larger than 10 MB. Your current data has not changed.');
    pendingRestore=readState(await file.text());
    showDialog('Restore backup',`<p class="quote">Restore this backup?</p>
      <p>${pendingRestore.tasks.length} tasks and ${pendingRestore.events.length} activity records. This replaces the tasks, history, settings and session in this browser.</p>
      <p class="small muted">A copy of your current work will download first. Any running session in the backup will be restored paused.</p>
      <button class="primary" data-action="restore-confirm">Download current data &amp; restore</button>
      <button class="quiet" data-action="closeov">Cancel</button>`);
  }catch(e){pendingRestore=null;showDialog('Backup not restored',`<p class="quote">Backup not restored</p><p>${esc(e.message)}</p><p>Your current work has not changed.</p><button data-action="closeov">Close</button>`);}
}
function restoreBackup(){
  if(!pendingRestore)return;
  exportData();
  if(protectedRaw!==null)download(protectedRaw,'ship-anyway-original.json');
  const restored=pendingRestore;
  // Freeze the backup's session at its last saved point; never restart it unattended.
  if(restored.active&&!restored.active.pausedAt)restored.active.pausedAt=Math.min(restored.updated,Date.now());
  restored.updated=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(restored));}
  catch(e){toast('Could not store the backup. Your current work has not changed.');return;}
  S=restored;capPick=S.settings.cap;protectedRaw=null;protectStorage=false;storageError='';pendingRestore=null;
  closeDialog();storageStatus();location.hash='now';render();toast('Backup restored.');
}

/* ---------- derived ---------- */
const task=id=>S.tasks.find(t=>t.id===id);
const activeTask=()=>S.active?task(S.active.taskId):null;
function openSpiral(){return [...S.events].reverse().find(e=>e.t==='spiral'&&!e.recovered);}
function resolveSpiral(now){const e=openSpiral();if(e)e.recovered=now;}
function outcomes(tasks){const o={fine:0,minor:0,problem:0};tasks.forEach(t=>{if(t.outcome)o[t.outcome]++;});return o;}
function stats(from,to){
  const inR=t=>t>=from&&t<to;
  const planned=S.tasks.filter(t=>t.planned&&inR(dayStart(t.planned)));
  const onDay=planned.filter(t=>t.started&&dayKey(t.started)===t.planned);
  const shipped=S.tasks.filter(t=>t.shipped&&inR(t.shipped));
  const inCap=shipped.filter(t=>!t.overtime);
  const started=S.tasks.filter(t=>t.started&&inR(t.started));
  const spirals=S.events.filter(e=>e.t==='spiral'&&inR(e.at));
  const rec=spirals.filter(e=>e.recovered).map(e=>(e.recovered-e.at)/60000);
  return {planned:planned.length,onDay:onDay.length,shipped:shipped.length,inCap:inCap.length,started:started.length,
    spirals:spirals.length,recovery:median(rec),outcomes:outcomes(shipped)};
}
const pct=(a,b)=>b?Math.round(100*a/b)+'%':'–';

/* ---------- routing ---------- */
function route(){
  const h=(location.hash||'#now').slice(1);
  const v=['now','week','setup'].includes(h)?h:'now';
  document.querySelectorAll('#nav a').forEach(a=>a.setAttribute('aria-current',a.dataset.view===v?'page':'false'));
  return v;
}
function render(){
  const v=route();
  $('#view').innerHTML=v==='week'?renderWeek():v==='setup'?renderSetup():renderNow();
  tick();
}
window.addEventListener('hashchange',render);

/* ---------- NOW ---------- */
function renderNow(){
  const parts=[],act=activeTask();
  if(act){
    const a=S.active,paused=!!a.pausedAt,over=(a.pausedAt||Date.now())>=a.ends;
    if(a.phase==='exercise'){
      parts.push(`<section class="card go stack"><p class="muted small" style="margin:0">Move in a way that works for you. Your task timer follows this break.</p>
        <div class="clock" id="clock">--:--</div><p class="title">Next: ${esc(act.title)}</p>
        ${companionAction('<button class="primary" data-action="skipex">Start the task now</button>','focus')}
        <div class="row"><button class="grow" data-action="pause">${paused?'Resume':'Pause'}</button><button class="quiet" data-action="stop">Save my place</button></div></section>`);
    }else{
      parts.push(`<section class="card ${over&&!a.quick?'warn':'go'} stack">
        <div class="row" style="justify-content:space-between"><span class="small muted">${a.quick?'A small start':`Pass ${a.passes} of 2 · ${a.passes===2?'5':act.cap} min`}</span><span class="small muted">${paused?'Paused':over?'Time to check in':''}</span></div>
        <div class="clock" id="clock">--:--</div><p class="title">${esc(act.title)}</p>
        ${act.nextStep?`<div class="next-step"><b>Start here</b>${esc(act.nextStep)}</div>`:''}
        ${a.quick?`<p style="margin:0">${over?'You started. That counts. Continue if you want, or save your place for later.':'Only the next small action. You can stop after two minutes.'}</p>`:`<div class="done-line"><b>Done means</b>${esc(act.done)}</div>`}
        ${!a.quick&&over?'<p style="margin:0">Time to check: does this meet your definition of done? You can finish, make one specific fix, or save a next step.</p>':''}
        ${a.passes===2&&act.revision?`<div class="next-step"><b>This pass is for</b>${esc(act.revision)}</div>`:''}
        ${a.quick?`${companionAction(`<button class="primary" data-action="continuework">Continue for ${act.cap} minutes</button>`,'focus')}
          <div class="row"><button class="grow" data-action="stop">Enough for now</button><button class="quiet" data-action="ship">Task is done</button></div>`:`${companionAction('<button class="primary" data-action="ship">Done — ship it</button>','focus')}
          ${over&&a.passes<2?'<button data-action="morepass">One specific fix · 5 minutes</button>':''}
          <button data-action="stop">Save my place</button>`}
        <button class="quiet" data-action="pause">${paused?'Resume timer':'Pause timer'}</button>
      </section>`);
    }
  }else{
    const s=S.settings;
    const queued=S.tasks.filter(t=>!t.shipped&&!t.dropped).sort((x,y)=>(y.savedAt||0)-(x.savedAt||0)||(x.planned||'9').localeCompare(y.planned||'9'));
    const recent=queued.filter(t=>t.savedAt&&dayKey(t.savedAt)>=dayKey(Date.now()-3*DAY)||t.planned===today());
    const older=queued.filter(t=>!recent.includes(t));
    if(welcomeBack)parts.push('<p class="welcome">Welcome back. Pick one small thing.</p>');
    parts.push(`<section><h2>One small start</h2><form class="card stack" id="startform">
      <label class="f">What’s one tiny action?<input type="text" id="t-title" placeholder="Open the proposal. Write one sentence." autocomplete="off"></label>
      ${companionAction('<button class="primary" type="submit" value="quick" formnovalidate>Start 2 minutes</button>',['saved','finished'].includes(companionMoment?.kind)?companionMoment.kind:'ready',companionMoment?.kind==='saved'?'A good place to pause.':companionMoment?.kind==='finished'?'You can let this one be done.':'One small step is enough.')}
      <p class="small muted" style="margin:0">Starting counts. You can stop when the two minutes are up.</p>
      <details id="start-options"><summary>More options</summary><div class="stack">
        <label class="f">Done means<textarea id="t-done" rows="2">${esc(s.done)}</textarea></label>
        <div class="chips">${DONE_PRESETS.map(p=>`<button type="button" class="chip" data-done="${esc(p)}">${esc(p.replace(/\.$/,''))}</button>`).join('')}</div>
        <div><span class="small muted">Focus time</span><div class="chips">${[15,25,45,60].map(c=>`<button type="button" class="chip" data-cap="${c}" aria-pressed="${c===capPick}">${c} min</button>`).join('')}
          <button type="button" class="chip" data-cap="custom" aria-pressed="${![15,25,45,60].includes(capPick)}">Custom</button>
          <input type="number" id="t-custom" min="1" max="240" inputmode="numeric" aria-label="Custom cap in minutes" style="width:6em" value="${![15,25,45,60].includes(capPick)?capPick:''}" ${[15,25,45,60].includes(capPick)?'hidden':''}></div></div>
        <label class="row small"><input type="checkbox" id="t-ex" ${s.exLast?'checked':''}> Optional movement for ${s.exercise} min first</label>
        <button type="submit" value="focus">Start a focus session</button>
        <div class="row"><button type="button" class="quiet grow" data-action="plan" data-day="${today()}">Plan for today</button><button type="button" class="quiet grow" data-action="plan" data-day="${dayKey(Date.now()+DAY)}">Plan for tomorrow</button></div>
      </div></details>
    </form></section>`);
    const list=items=>`<ul class="plain">${items.map(t=>`<li class="queue-item"><span><strong>${esc(t.title)}</strong>${t.nextStep?`<br><span class="small">Next: ${esc(t.nextStep)}</span>`:''}<br><span class="small muted">${t.savedAt?'Your place is saved':t.planned?fmtDate(t.planned):'Whenever you’re ready'}</span></span>
      <span class="row"><button class="grow" data-action="${t.started?'resumeq':'quickq'}" data-id="${esc(t.id)}">${t.started?'Resume':'Start'} for 2 minutes</button><button class="quiet" data-action="drop" data-id="${esc(t.id)}" aria-label="Set aside ${esc(t.title)}">Set aside</button></span>
      <span class="row small" style="gap:6px"><label class="row small" style="gap:6px">Remind me at <input type="time" data-time="${esc(t.id)}" value="${esc(t.at||'09:00')}" style="width:auto;padding:4px 8px"></label><a class="chip" target="_blank" rel="noopener noreferrer" href="${esc(gcal({title:t.title,day:t.planned||today(),at:t.at,minutes:t.cap||S.settings.cap,details:'Open Ship Anyway and start for 2 minutes.\nDone means: '+(t.done||S.settings.done)+'\n'+pageLink()}))}">Add to Google Calendar</a></span></li>`).join('')}</ul>`;
    if(recent.length)parts.push(`<section><h2>Pick up where you left off</h2>${list(recent)}</section>`);
    if(older.length)parts.push(`<details class="card"><summary>Other saved tasks (${older.length})</summary>${list(older)}</details>`);
    const aside=S.tasks.filter(t=>t.dropped&&!t.shipped);

  }
  const due=dueTasks().slice(0,3);
  if(due.length&&!act)parts.push(`<details class="card"><summary>Optional check-ins (${due.length})</summary><div class="stack">${due.map(t=>`<div>

  return parts.join('');
}
function dueTasks(){return S.tasks.filter(t=>t.shipped&&!t.outcome&&!t.skipCheck&&Date.now()-t.shipped>DAY&&(!t.checkAfter||t.checkAfter<=Date.now()));}

/* ---------- WEEK ---------- */
function renderWeek(){
  const now=Date.now();
  const cur=stats(now-7*DAY,now+1);
  const bStart=dayStart(S.settings.start);
  const hasBase=now-bStart>=14*DAY;
  const base=stats(bStart,bStart+7*DAY);
  const tile=(n,l,b)=>`<div class="tile"><div class="n">${n}</div><div class="l">${l}</div><div class="b">${hasBase?'week one: '+b:'baseline forms after 14 days'}</div></div>`;
  const review=S.settings.review;const daysTo=Math.ceil((dayStart(review)-now)/DAY);
  // 8-week ship chart
  const weeks=[];for(let i=7;i>=0;i--){const to=now-(i*7*DAY);const from=to-7*DAY;weeks.push({n:S.tasks.filter(t=>t.shipped&&t.shipped>=from&&t.shipped<to).length,label:fmtDate(dayKey(from))});}
  const max=Math.max(1,...weeks.map(w=>w.n));
  const W=520,H=150,L=28,B=26,bw=(W-L-8)/8;
  let svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Shipped per week, last 8 weeks">`;
  const top=16,floor=H-B;
  [0,max].forEach(v=>{const y=floor-(floor-top)*(v/max);svg+=`<text x="${L-6}" y="${y+4}" font-size="11" text-anchor="end" fill="var(--muted)">${v}</text><line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`;});
  weeks.forEach((w,i)=>{const h=(floor-top)*(w.n/max);const x=L+i*bw+4;const y=floor-h;
    svg+=`<rect x="${x}" y="${y}" width="${bw-8}" height="${h}" rx="3" fill="${i===7?'var(--go)':'var(--soft)'}" stroke="var(--line)"/>`;
    if(w.n)svg+=`<text x="${x+(bw-8)/2}" y="${y-4}" font-size="11" text-anchor="middle" fill="var(--ink)">${w.n}</text>`;
    svg+=`<text x="${x+(bw-8)/2}" y="${H-8}" font-size="10" text-anchor="middle" fill="var(--muted)">${esc(w.label)}</text>`;});
  svg+='</svg>';
  return `
  <section><h2>Last 7 days</h2><div class="tiles">
    ${tile(pct(cur.onDay,cur.planned),`started on the day planned (${cur.onDay}/${cur.planned})`,pct(base.onDay,base.planned))}
    ${tile(cur.shipped,`shipped · ${pct(cur.inCap,cur.shipped)} inside the cap`,base.shipped+' shipped')}
    ${tile(fmtMin(cur.recovery),`median time from a spiral to the next start or ship (${cur.spirals} spirals)`,fmtMin(base.recovery))}
  </div></section>
  <section><h2>Shipped per week</h2><div class="card">${svg}</div></section>
  <section><h2>Review</h2><div class="card stack">
    <p style="margin:0">${daysTo>0?`Your optional review is on ${esc(fmtDate(review))}, in ${daysTo} days.`:`Your review date was ${esc(fmtDate(review))}. You can reflect when you’re ready or choose another date in Setup.`}</p>
    <p class="small muted" style="margin:0">These numbers are information, not a grade. Notice what helped you start, return, or finish. Change the review date in Setup.</p>
    <button data-action="copy">Copy weekly check-in text</button>
    <p class="small muted" style="margin:0">Paste it to whoever holds you accountable. The page can't send it for you.</p>
  </div></section>`;
}
function checkinText(){
  const now=Date.now();const c=stats(now-7*DAY,now+1);const o=c.outcomes;
  return `Week ending ${fmtDate(today())}: started ${c.started} tasks (${c.onDay} of ${c.planned} planned ones on the day planned), shipped ${c.shipped} (${c.inCap} inside the cap). Of shipped work with a follow-up: ${o.fine} fine, ${o.minor} minor fix, ${o.problem} real problem. ${c.spirals} spirals, median recovery ${fmtMin(c.recovery)}.`;
}

/* ---------- timer, chime, wake lock ---------- */
let timer=null,audio=null,wake=null,chimed=null;
const soundNodes=new Set();let soundGeneration=0;
function stopSound(){
  soundGeneration++;
  for(const {o,g} of soundNodes){try{o.stop();}catch(e){}o.disconnect();g.disconnect();}
  soundNodes.clear();
}
function audioContext(){
  if(!audio||audio.state==='closed')audio=new (window.AudioContext||window.webkitAudioContext)();
  return audio;
}
async function chime(preview=false){
  stopSound();
  const sound=S.settings.sound,volume=S.settings.volume,generation=soundGeneration;
  if(sound==='silent'||volume===0)return;
  try{
    const ctx=audioContext();
    if(ctx.state==='suspended')await ctx.resume();
    if(generation!==soundGeneration)return;
    if(ctx.state!=='running')throw Error('Audio unavailable');
    const t=ctx.currentTime+.015;
    function note(freq,delay,duration,level=.25,endFreq=null){
      const o=ctx.createOscillator(),g=ctx.createGain(),nodes={o,g};soundNodes.add(nodes);
      o.type='sine';o.frequency.setValueAtTime(freq,t+delay);
      if(endFreq)o.frequency.exponentialRampToValueAtTime(endFreq,t+delay+duration);
      g.gain.setValueAtTime(.0001,t+delay);
      g.gain.exponentialRampToValueAtTime(Math.max(.0001,level*volume),t+delay+.015);
      g.gain.exponentialRampToValueAtTime(.0001,t+delay+duration);
      o.connect(g);g.connect(ctx.destination);
      o.onended=()=>{o.disconnect();g.disconnect();soundNodes.delete(nodes);};
      o.start(t+delay);o.stop(t+delay+duration+.02);
    }
    if(sound==='chime')[660,660,880].forEach((f,i)=>note(f,i*.35,.3));
    else if(sound==='bell')[[523.25,0],[659.25,.5]].forEach(([f,d])=>{
      note(f,d,1.3,.22);note(f*2,d,.8,.055);note(f*3,d,.4,.022);
    });
    else if(sound==='drops')[880,1046.5,783.99].forEach((f,i)=>note(f,i*.28,.22,.23,f*.5));
    else if(sound==='rise')[523.25,659.25,783.99].forEach((f,i)=>note(f,i*.22,.55,.18));
    if(preview)toast('Playing '+SOUNDS[sound].toLowerCase()+'.');
  }catch(e){if(preview)toast('Couldn’t play audio. Check your browser’s sound permissions and device volume.');}
}
function primeAudio(){
  if(S.settings.sound==='silent'||S.settings.volume===0)return;
  try{const ctx=audioContext();if(ctx.state==='suspended')ctx.resume().catch(()=>{});}catch(e){}
}
async function lockScreen(on){
  try{if(on&&!wake&&navigator.wakeLock){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>{wake=null;});}
    else if(!on&&wake){await wake.release();wake=null;}}catch(e){wake=null;}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')tick();else lockScreen(false);});
function tick(){
  const a=S.active,c=$('#clock');
  if(!a){document.title='Ship Anyway';lockScreen(false);return;}
  lockScreen(!a.pausedAt&&document.visibilityState==='visible');
  if(a.pausedAt){if(c)c.textContent='paused';document.title='Paused · Ship Anyway';return;}
  const left=a.ends-Date.now();
  if(a.phase==='exercise'&&left<=0){
    S.events.push({t:'exercise',at:Date.now(),taskId:a.taskId});a.phase='work';a.ends=Date.now()+task(a.taskId).cap*60000;a.passes=1;chime();save();return;
  }
  const seconds=Math.max(0,Math.ceil(left/1000)),txt=pad(Math.floor(seconds/60))+':'+pad(seconds%60);
  if(c)c.textContent=txt;

}

    for(const a of alts){reply=command(a);if(reply!==null){toast('“'+a+'”');break;}}

const WORDS={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,fifteen:15,twenty:20,thirty:30,forty:40,fortyfive:45,fifty:50,sixty:60,ninety:90};

  if(/^\d+$/.test(raw))return +raw;const parts=raw.split(/[ -]/);let n=0;for(const p of parts){if(WORDS[p]!=null)n+=WORDS[p];}return n||null;}
function command(raw){

    S.tasks.push({id:uid(),title:cap1(title),done:S.settings.done,cap:Math.max(1,Math.min(240,minutesIn(t)||S.settings.cap)),created:Date.now(),planned:day,started:null,shipped:null,passes:0,overtime:false,outcome:null});save();return 'Planned for '+(m[2]||'today')+'.';}

}

/* ---------- Google Calendar links: a prefilled "new event" page, no API, no sign-in, nothing sent by this page ---------- */
const z=d=>new Date(d).toISOString().replace(/[-:]|\.\d{3}/g,'');

}

  showDialog('Voice commands',`<div class="stack">
    ${!SR?'<p>This browser does not offer speech recognition to this page. Try opening Ship Anyway in Google Chrome for voice commands.</p>':''}
    <p class="quote">Tap Talk, then say one of these.</p>${localVoiceSupported()?'<button data-action="voice-local-check">Set up on-device voice</button>':''}
    <ul class="plain small">
      <li><span>“Start the proposal for 45 minutes”<br><span class="muted">title and cap optional; add “move first” for the warm-up</span></span></li>
      <li><span>“Ship it” · “Pause” · “Resume” · “One more pass” · “Stop”</span></li>
      <li><span>“Spiraling” · then “Back to it”</span></li>
      <li><span>“Nothing bad” · “Minor fix” · “Real problem”<br><span class="muted">answers the waiting check-in</span></span></li>
      <li><span>“Plan the invoice for tomorrow” · “Time left” · “How am I doing”</span></li>
    </ul>
    <p class="small muted" style="margin:0">Your browser may send audio to its speech recognition provider. Voice is optional and browser support varies. Task data stays in this browser.</p>
    <button class="quiet" data-action="closeov">Close</button></div>`);
}
function begin(t,withEx,quick=false){
  const now=Date.now(),resuming=!!t.started;
  if(!t.started)t.started=now;
  if(!t.planned)t.planned=today();
  if(resuming)S.events.push({t:'resumed',at:now,taskId:t.id});
  t.savedAt=null;t.dropped=false;resolveSpiral(now);
  const ex=withEx?S.settings.exercise:0;
  S.active={taskId:t.id,phase:ex?'exercise':'work',ends:now+(ex?ex:quick?2:t.cap)*60000,passes:ex?0:1,startedAt:now,quick};
  reactCompanion('start');chimed=null;location.hash='now';save();
}
document.addEventListener('change',e=>{
  const el=e.target,s=S.settings;
  if(el.id==='restore-file'){prepareRestore(el.files[0]);el.value='';return;}
  if(el.id==='s-cap'){s.cap=Math.max(1,Math.min(240,+el.value||25));capPick=s.cap;}
  else if(el.id==='s-companion'){s.companion=el.value;companionMoment=null;clearTimeout(companionTimer);}
  else if(el.name==='character'){s.character=el.value;companionMoment=null;}
  else if(el.id==='s-sound'){s.sound=el.value;stopSound();}
  else if(el.id==='s-volume'){s.volume=Math.max(0,Math.min(1,+el.value/100));stopSound();}
  else if(el.id==='s-ex')s.exercise=Math.max(5,Math.min(60,+el.value||20));
  else if(el.id==='s-done')s.done=el.value.trim()||s.done;
  else if(el.id==='s-start'&&el.value)s.start=el.value;
  else if(el.id==='s-review'&&el.value)s.review=el.value;
  else if(el.id==='s-checkin'&&el.value)s.checkinAt=el.value;
  else if(el.dataset.time){const t=task(el.dataset.time);if(t&&el.value)t.at=el.value;}
  else return;
  save();
  if(['s-companion','s-sound','s-volume'].includes(el.id))document.getElementById(el.id)?.focus();
  if(el.name==='character')document.querySelector(`input[name="character"][value="${S.settings.character}"]`)?.focus();
});
document.addEventListener('input',e=>{
  if(e.target.id==='s-volume'){
    const value=e.target.value;$('#volume-label').textContent=value+'%';e.target.setAttribute('aria-valuetext',value+' percent');
  }
});
let dialogReturnFocus=null,dialogPausedSession=null;
function showDialog(label,content){
  clearTimeout(toastT);$('#toast').hidden=true;
  if($('#overlay').hidden){
    dialogReturnFocus=document.activeElement;
    // Reading a rescue prompt should not consume the work timer.
    if(S.active&&!S.active.pausedAt){dialogPausedSession=S.active;S.active.pausedAt=Date.now();save();}
  }
  $('#overlay').innerHTML=`<div class="card stack" role="dialog" aria-modal="true" aria-label="${esc(label)}" tabindex="-1">${content}</div>`;
  $('#overlay').hidden=false;$('.wrap').inert=true;$('#fab').hidden=true;$('#talk').hidden=true;
  const focus=$('#overlay').querySelector('input:not([type=checkbox]),textarea,button,[tabindex]');focus?.focus();
}
function closeDialog(){
  if($('#overlay').hidden)return;
  voiceSetupEpoch++;
  $('#overlay').hidden=true;$('.wrap').inert=false;$('#fab').hidden=false;$('#talk').hidden=false;
  if(dialogPausedSession&&S.active===dialogPausedSession&&S.active.pausedAt){S.active.ends+=Date.now()-S.active.pausedAt;S.active.pausedAt=null;save();}
  dialogPausedSession=null;
  if(dialogReturnFocus?.isConnected&&!dialogReturnFocus.closest('[hidden]'))dialogReturnFocus.focus();else $('#fab').focus();
}
document.addEventListener('keydown',e=>{
  if($('#overlay').hidden)return;
  if(e.key==='Escape'){e.preventDefault();pendingRestore=null;closeDialog();return;}
  if(e.key==='Tab'){
    const items=[...$('#overlay').querySelectorAll('button,input,textarea,a[href],summary')].filter(el=>!el.disabled&&el.getClientRects().length);
    if(!items.length)return;
    const first=items[0],last=items[items.length-1];
    if(e.shiftKey&&(document.activeElement===first||!items.includes(document.activeElement))){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&(document.activeElement===last||!items.includes(document.activeElement))){e.preventDefault();first.focus();}
  }
});
function recordStuck(){if(!openSpiral()){S.events.push({t:'spiral',at:Date.now(),taskId:S.active?.taskId||null});save();}}
function showSpiral(){
  showDialog('I’m stuck',`${companionHeading('What would help right now?')}
    <button data-action="stuck-small">It feels too big</button>
    <button data-action="stuck-polish">I keep polishing</button>
    <button data-action="stuck-break">I’m overwhelmed</button>
    <details><summary>More support</summary><p>You don’t have to solve the whole task now. One small action, a clear stopping point, or a break is enough to choose.</p></details>
    <button class="quiet" data-action="closeov">Back</button>`);
}
function showSmallStep(){
  showDialog('One smaller step',`<p class="quote">Make the next step tiny.</p>
    <label class="f">What could you do in two minutes?<input type="text" id="sp-step" placeholder="Open the file. Write one sentence." value="${esc(activeTask()?.nextStep||'')}" autocomplete="off"></label>
    <button class="primary" data-action="back">Start this step · 2 minutes</button><button class="quiet" data-action="closeov">Back</button>`);
}
function showPolishing(){
  const t=activeTask();
  showDialog('A stopping point',`<p class="quote">Check the standard you set.</p>
    <div class="done-line"><b>Done means</b>${esc(t?.done||S.settings.done)}</div>
    <p>Does the work meet this? Extra polish can wait.</p>
    ${t?'<button class="primary" data-action="ship">Yes — task is done</button><button data-action="stop">Save a next step for later</button>':'<button class="primary" data-action="stuck-small">Choose one small step</button>'}
    <button class="quiet" data-action="closeov">Back</button>`);
}
function showSavePlace(){
  const t=activeTask();if(!t)return;
  showDialog('Save my place',`${companionHeading('You can stop here.','saved')}<p style="margin:0">${esc(t.title)}</p>
    <label class="f">Next time, start by… (optional)<input type="text" id="save-step" value="${esc(t.nextStep||'')}" placeholder="Adding the price to paragraph two." autocomplete="off"></label>
    <button class="primary" data-action="saveplace">Save my place</button><button class="quiet" data-action="closeov">Keep going</button>`);
}
function showVoiceConsent(){
  showDialog('Optional voice input',`<p class="quote">Use your voice?</p><p>Online recognition may send microphone audio to your browser’s speech recognition provider. All tasks can also be managed with the buttons.</p>${localVoiceSupported()?'<button class="primary" data-action="voice-local-check">Set up on-device voice</button>':''}<button data-action="voice-enable">Enable voice &amp; listen</button><button class="quiet" data-action="closeov">Use buttons</button>`);
}
function showVoiceUnavailable(){
  showDialog('Voice support',`<p class="quote">Voice commands need a supported browser.</p>
    <p>This browser does not offer speech recognition to this page. Try opening Ship Anyway in <strong>Google Chrome</strong>, then tap <strong>Talk</strong> and allow microphone access.</p>
    <p class="small muted">To bring your tasks to another browser, use Setup → Download backup here, then Restore backup there.</p>
    <button data-action="voicehelp">See voice commands</button><button class="primary" data-action="closeov">Got it</button>`);
}
async function copy(text){
  try{await navigator.clipboard.writeText(text);toast('Copied.');}
  catch(e){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';document.body.appendChild(ta);ta.select();toast('Select and copy the text.');setTimeout(()=>ta.remove(),8000);}
}
let toastT=null;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3500);}
window.shipAnyway={command};
storageStatus();render();timer=setInterval(tick,1000);
})();
</script>
